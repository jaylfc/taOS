# taOS preseed for Debian 13 (trixie) netinst
# Unattended where safe, interactive where data is at stake

# Task selection: standard system + SSH server, no desktop task
d-i tasksel/first multiselect standard, ssh-server

# Package selection: include curl, ca-certificates, sudo, git for first-boot
d-i pkgsel/include string curl ca-certificates sudo git
d-i pkgsel/upgrade select full-upgrade

# Popularity contest: opt out
popularity-contest popularity-contest/participate boolean false

# Late command: copy taOS first-boot files and enable the service
d-i preseed/late_command string \
  mkdir -p /target/taos; \
  cp /cdrom/taos/install.sh /target/usr/local/share/taos/install.sh; \
  chmod 0755 /target/usr/local/share/taos/install.sh; \
  cp /cdrom/taos/taos-firstboot.sh /target/usr/local/sbin/taos-firstboot; \
  chmod 0755 /target/usr/local/sbin/taos-firstboot; \
  cp /cdrom/taos/taos-firstboot.service /target/etc/systemd/system/taos-firstboot.service; \
  in-target systemctl enable taos-firstboot.service