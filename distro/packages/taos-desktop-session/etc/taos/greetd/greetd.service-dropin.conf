# Linked to /etc/systemd/system/greetd.service.d/10-taos.conf by
# 'taos-desktop enable' and removed by 'taos-desktop disable'.
[Service]
ExecStart=
ExecStart=/usr/sbin/greetd --config /etc/taos/greetd/config.toml
# The login screen's console (VT 7) is cleared and its cursor hidden first, so
# the moment between the login screen and the desktop is plain black.
ExecStartPre=-/bin/sh -c 'printf "\033[?25l\033[2J\033[H\033[?1c" > /dev/tty7'
