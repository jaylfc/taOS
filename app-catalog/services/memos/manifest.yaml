category: productivity
description: "Lightweight note-taking and knowledge base \u2014 agents can store and\
  \ retrieve notes"
hardware_tiers:
  arm-npu-16gb: full
  arm-npu-32gb: full
  cpu-only: full
  x86-cuda-12gb: full
  x86-vulkan-8gb: full
homepage: https://usememos.com
id: memos
install:
  image: neosmemo/memos:stable
  method: docker
  ports:
  - 5230
  volumes:
  - data:/var/opt/memos
license: MIT
lifecycle:
  health_check: curl -sf http://localhost:5230
name: Memos
requires:
  disk_mb: 200
  ram_mb: 128
type: service
version: stable
