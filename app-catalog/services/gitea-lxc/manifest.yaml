backend: lxc
category: dev-tool
description: "Self-hosted Git server \u2014 auto-creates accounts for deployed agents"
hardware_tiers:
  arm-npu-16gb: full
  arm-npu-32gb: full
  cpu-only: full
  x86-cuda-12gb: full
  x86-vulkan-8gb: full
homepage: https://gitea.io
id: gitea-lxc
install:
  cpu_limit: 1
  gitea_version: 1.22.6
  image: images:debian/bookworm
  memory_limit: 512MiB
  method: lxc
  ports:
    http: 3000
    ssh: 2222
  service_name: gitea
  state_paths:
  - /etc/gitea/
  - /home/git/
  ui_path: /
  ui_port: 3000
license: MIT
lifecycle:
  health_check: curl -sf http://localhost:3000/api/healthz
name: Gitea (LXC)
requires:
  disk_mb: 2000
  inputs:
  - description: Password for the initial Gitea admin account
    label: Admin password
    name: admin_password
    required: true
    type: password
  ram_mb: 512
type: service
version: 1.22.0
