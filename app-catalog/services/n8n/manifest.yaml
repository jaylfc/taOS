category: automation
description: "Workflow automation with 400+ integrations \u2014 connect agents to\
  \ external services"
hardware_tiers:
  arm-npu-16gb: full
  arm-npu-32gb: full
  cpu-only: full
  x86-cuda-12gb: full
  x86-vulkan-8gb: full
homepage: https://github.com/n8n-io/n8n
id: n8n
install:
  env:
    N8N_SECURE_COOKIE: 'false'
  image: n8nio/n8n:1.80.0
  method: docker
  ports:
  - 5678
  volumes:
  - data:/home/node/.n8n
license: Sustainable Use License
name: n8n
requires:
  disk_mb: 500
  ram_mb: 384
type: service
version: 1.80.0
