category: dev-tool
description: "VS Code in the browser \u2014 web IDE for development and agent code\
  \ editing"
hardware_tiers:
  arm-npu-16gb: full
  arm-npu-32gb: full
  cpu-only: degraded
  x86-cuda-12gb: full
  x86-vulkan-4gb: degraded
  x86-vulkan-8gb: full
homepage: https://github.com/coder/code-server
id: code-server
install:
  env:
    DEFAULT_WORKSPACE: /home/coder/workspace
    PGID: '1000'
    PUID: '1000'
    TZ: Europe/London
  image: lscr.io/linuxserver/code-server:4.135.0
  method: docker
  ports:
  - 8443
  volumes:
  - config:/config
  - workspace:/home/coder/workspace
license: MIT
lifecycle:
  health_check: curl -sf http://localhost:8443/healthz
name: Code Server
requires:
  disk_mb: 1000
  ram_mb: 512
type: service
version: 4.96.0
