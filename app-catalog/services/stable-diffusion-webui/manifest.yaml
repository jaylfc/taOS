category: image-gen
description: "AUTOMATIC1111's web UI for Stable Diffusion \u2014 the most popular\
  \ image generation interface"
hardware_tiers:
  arm-npu-16gb: unsupported
  arm-npu-32gb: unsupported
  cpu-only: unsupported
  x86-cuda-12gb: full
  x86-cuda-24gb: full
  x86-cuda-8gb: full
  x86-rocm-12gb: full
  x86-vulkan-8gb: degraded
homepage: https://github.com/AUTOMATIC1111/stable-diffusion-webui
id: stable-diffusion-webui
install:
  image: ghcr.io/ai-dock/stable-diffusion-webui:1.10.0
  method: docker
  ports:
  - 7860
  volumes:
  - data:/workspace
  - models:/workspace/stable-diffusion-webui/models
  - outputs:/workspace/stable-diffusion-webui/outputs
license: AGPL-3.0
name: Stable Diffusion Web UI
requires:
  disk_mb: 10000
  ram_mb: 2048
type: service
version: 1.10.0
