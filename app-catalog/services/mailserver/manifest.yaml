category: infrastructure
description: "Simple full-stack mail server \u2014 agents can send and receive email"
hardware_tiers:
  arm-npu-16gb: full
  arm-npu-32gb: full
  cpu-only: full
  x86-cuda-12gb: full
homepage: https://github.com/docker-mailserver/docker-mailserver
id: mailserver
install:
  env:
    ENABLE_CLAMAV: '0'
    ENABLE_FAIL2BAN: '0'
    ENABLE_SPAMASSASSIN: '0'
    SSL_TYPE: ''
  image: ghcr.io/docker-mailserver/docker-mailserver:14.0.0
  method: docker
  ports:
  - 25
  - 143
  - 587
  - 993
  volumes:
  - mail-data:/var/mail
  - mail-state:/var/mail-state
  - mail-logs:/var/log/mail
  - config:/tmp/docker-mailserver
license: MIT
name: Docker Mailserver
requires:
  disk_mb: 2000
  ram_mb: 512
type: service
version: 14.0.0
