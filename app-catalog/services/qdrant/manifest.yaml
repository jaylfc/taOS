category: vector-db
description: "High-performance vector database \u2014 Rust core, gRPC + REST APIs,\
  \ payload filtering, hybrid search. Production-grade for RAG."
hardware_tiers:
  apple-silicon: full
  arm-npu-16gb: full
  arm-npu-32gb: full
  arm-npu-4gb: full
  cpu-only: full
  x86-cuda-4gb: full
  x86-vulkan-4gb: full
homepage: https://qdrant.tech
id: qdrant
install:
  image: qdrant/qdrant:v1.13.0
  method: docker
  ports:
  - 6333:6333
  - 6334:6334
  volumes:
  - qdrant-storage:/qdrant/storage
license: Apache-2.0
lifecycle:
  auto_manage: false
  keep_alive_minutes: 0
name: Qdrant
requires:
  disk_mb: 2000
  ram_mb: 1024
type: service
version: 1.13.0
