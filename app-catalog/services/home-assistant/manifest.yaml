category: home
description: "Home automation platform \u2014 agents can control smart home devices\
  \ and automations"
hardware_tiers:
  arm-npu-16gb: full
  arm-npu-32gb: full
  cpu-only: full
  x86-cuda-12gb: full
  x86-vulkan-8gb: full
homepage: https://www.home-assistant.io
id: home-assistant
install:
  env:
    TZ: UTC
  image: ghcr.io/home-assistant/home-assistant:stable
  method: docker
  ports:
  - 8123
  volumes:
  - config:/config
license: Apache-2.0
lifecycle:
  health_check: curl -sf http://localhost:8123/api/
name: Home Assistant
requires:
  disk_mb: 1000
  ram_mb: 512
type: service
version: stable
