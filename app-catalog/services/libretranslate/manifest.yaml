category: productivity
description: "Self-hosted translation API \u2014 30+ languages, no cloud, agents can\
  \ translate content"
hardware_tiers:
  arm-cpu-8gb: degraded
  arm-npu-16gb: full
  cpu-only: degraded
  x86-cuda-12gb: full
homepage: https://github.com/LibreTranslate/LibreTranslate
id: libretranslate
install:
  image: libretranslate/libretranslate:1.6.0
  method: docker
  ports:
  - 5000
  volumes:
  - data:/home/libretranslate/.local
license: AGPL-3.0
name: LibreTranslate
requires:
  disk_mb: 2000
  ram_mb: 1024
type: service
version: 1.6.0
