category: productivity
description: "Web file manager \u2014 browse and manage agent workspaces through a\
  \ clean browser UI"
hardware_tiers:
  arm-npu-16gb: full
  arm-npu-32gb: full
  cpu-only: full
  x86-cuda-12gb: full
  x86-vulkan-8gb: full
homepage: https://filebrowser.org
id: filebrowser
install:
  image: filebrowser/filebrowser:2.27.0
  method: docker
  ports:
  - 8080
  volumes:
  - data:/srv
  - config:/config
license: Apache-2.0
lifecycle:
  health_check: curl -sf http://localhost:8080
name: File Browser
requires:
  disk_mb: 100
  ram_mb: 64
type: service
version: 2.27.0
