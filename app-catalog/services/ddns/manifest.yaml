category: infrastructure
description: "Automatic DNS updates \u2014 access your TinyAgentOS from a custom domain\
  \ even with a changing IP"
hardware_tiers:
  arm-npu-16gb: full
  arm-npu-32gb: full
  cpu-only: full
  x86-cuda-12gb: full
homepage: https://github.com/qdm12/ddns-updater
id: ddns
install:
  env:
    PERIOD: 5m
  image: qmcgaw/ddns-updater:v1
  method: docker
  ports:
  - 8000
  volumes:
  - data:/updater/data
license: MIT
name: Dynamic DNS
requires:
  disk_mb: 50
  ram_mb: 32
type: service
version: 1.0.0
