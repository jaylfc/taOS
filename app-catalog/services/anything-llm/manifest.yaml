category: ai-app
description: "Self-hosted ChatGPT for any LLM + any document \u2014 privacy-first,\
  \ multi-user, agent skills, runs against any OpenAI-compatible API or local model."
hardware_tiers:
  apple-silicon: full
  arm-npu-16gb: full
  arm-npu-32gb: full
  cpu-only: full
  x86-cuda-12gb: full
  x86-vulkan-8gb: full
homepage: https://github.com/Mintplex-Labs/anything-llm
id: anything-llm
install:
  env:
    STORAGE_DIR: /app/server/storage
  image: mintplexlabs/anythingllm:1.7.0
  method: docker
  ports:
  - 3001
  volumes:
  - storage:/app/server/storage
license: MIT
name: AnythingLLM
requires:
  disk_mb: 3000
  ram_mb: 1024
type: service
version: 1.7.0
