category: productivity
description: "Bookmark and link manager \u2014 agents save and organize research links\
  \ with archiving"
hardware_tiers:
  arm-npu-16gb: full
  arm-npu-32gb: full
  cpu-only: full
  x86-cuda-12gb: full
  x86-vulkan-8gb: full
homepage: https://linkwarden.app
id: linkwarden
install:
  companions:
  - env:
      POSTGRES_DB: linkwarden
      POSTGRES_PASSWORD: '{secret_key}'
      POSTGRES_USER: linkwarden
    image: postgres:16-alpine
    name: postgres
    volumes:
    - pgdata:/var/lib/postgresql/data
  env:
    DATABASE_URL: postgresql://linkwarden:{secret_key}@postgres:5432/linkwarden
    NEXTAUTH_SECRET: '{secret_key}'
    NEXTAUTH_URL: http://localhost:3000
  image: ghcr.io/linkwarden/linkwarden:2.13.0
  method: docker
  ports:
  - 3000
  volumes:
  - data:/data/data
license: AGPL-3.0
lifecycle:
  health_check: curl -sf http://localhost:3000
name: Linkwarden
requires:
  disk_mb: 500
  ram_mb: 256
type: service
version: 2.13.0
