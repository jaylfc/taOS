category: productivity
description: "Document management system \u2014 scan, OCR, tag, and search paper documents.\
  \ Agents manage your paperwork."
hardware_tiers:
  arm-cpu-8gb: full
  arm-npu-16gb: full
  cpu-only: full
  x86-cuda-12gb: full
homepage: https://github.com/paperless-ngx/paperless-ngx
id: paperless-ngx
install:
  image: ghcr.io/paperless-ngx/paperless-ngx:2.14.0
  method: docker
  ports:
  - 8000
  volumes:
  - data:/usr/src/paperless/data
  - media:/usr/src/paperless/media
license: GPL-3.0
name: Paperless-ngx
requires:
  disk_mb: 2000
  ram_mb: 512
type: service
version: 2.14.0
