category: ai-app
description: "Self-hosted AI search engine \u2014 open source Perplexity alternative\
  \ with citations"
hardware_tiers:
  arm-npu-16gb: full
  arm-npu-32gb: full
  cpu-only: full
  x86-cuda-12gb: full
  x86-vulkan-8gb: full
homepage: https://github.com/ItzCrazyKns/Perplexica
id: perplexica
install:
  env:
    SEARXNG_URL: http://host.docker.internal:8888
  image: itzcrazykns/perplexica:1.9.0
  method: docker
  ports:
  - 3001
  volumes:
  - data:/home/perplexica/data
license: MIT
name: Perplexica
requires:
  disk_mb: 1000
  ram_mb: 512
type: service
version: 1.9.0
