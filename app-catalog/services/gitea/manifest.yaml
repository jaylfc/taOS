category: dev-tool
description: "Self-hosted Git server \u2014 auto-creates accounts for deployed agents"
hardware_tiers:
  arm-npu-16gb: full
  arm-npu-32gb: full
  cpu-only: full
  x86-cuda-12gb: full
  x86-vulkan-8gb: full
homepage: https://gitea.io
id: gitea
install:
  env:
    GITEA__server__ROOT_URL: http://localhost:3000
    GITEA__server__SSH_PORT: '2222'
  image: gitea/gitea:1.22
  method: docker
  ports:
  - 3000
  volumes:
  - data:/data
  - config:/etc/gitea
license: MIT
lifecycle:
  health_check: curl -sf http://localhost:3000/api/healthz
name: Gitea
requires:
  disk_mb: 500
  ram_mb: 256
type: service
version: 1.22.0
