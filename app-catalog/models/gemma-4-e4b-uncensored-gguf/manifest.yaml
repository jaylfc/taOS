    # TODO: sha256 not yet resolved (xet-backed repo, no LFS pointer). Fill in before release.
    sha256: ''
    requires:
      backends:
        - id: ollama
          targets: [apple-silicon, x86-cuda, x86-vulkan, arm-vulkan, cpu]
          min_ram_mb: 6144
        - id: llama-cpp
          targets: [x86-vulkan, arm-vulkan, cpu]
