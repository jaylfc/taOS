name: bot-review-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]

jobs:
  bot-review-gate:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check bot review gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_bot_review.py ${{ github.event.pull_request.number }} --head-sha ${{ env.PR_HEAD }} --owner ${{ github.repository_owner }} --repo ${{ github.event.repository.name }}
