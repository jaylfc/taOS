version: 2
updates:
  # Python (controller + worker) -- managed by uv (pyproject.toml + uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns:
          - "*"
    ignore:
      # fastapi 0.137 regressed include_router so sub-router routes are not
      # registered (#903); pyproject pins fastapi<0.137. Stop dependabot
      # proposing the cap-raise until the regression is fixed upstream.
      - dependency-name: "fastapi"
        versions: [">=0.137"]
      # litellm's specifier must pin the EXACT minor the inlined proxy subset
      # mirrors (>=1.94.2,<1.95). litellm[proxy] pulls litellm-enterprise, so
      # the proxy subset is inlined instead, and a wider cap lets a fresh
      # resolve outrun that subset -- which is why
      # tests/test_install_licences.py::test_proxy_extra_pins_litellm_to_the_minor_it_mirrors
      # rejects any ceiling wider than the mirrored minor. Dependabot proposing
      # a cap-raise (e.g. <1.100 in #2810) can therefore only ever fail CI.
      # Re-mirroring onto a new minor is a deliberate change, not an auto-bump.
      - dependency-name: "litellm"
        versions: [">=1.95"]
      # The inlined proxy subset mirrors litellm 1.94.2's own [proxy] extra, minus
      # litellm-enterprise. Each sibling carries its own ceiling; widening or
      # removing it lets a fresh ``pip install -e ".[proxy]"`` pull a version
      # litellm 1.94.2 was not released against (mcp 2.x, rich 15, websockets 17,
      # gunicorn 26 in #3083). tests/test_install_licences.py::test_proxy_extra_ceilings_do_not_outrun_the_mirrored_snapshot
      # rejects ceiling widening/removal. Re-mirroring is a deliberate change
      # that must update both the inlined list and
      # tests/data/litellm-proxy-extra-1.94.2.txt together.
      - dependency-name: "apscheduler"
        update-types: ["version-update:semver-major"]
      - dependency-name: "azure-identity"
        update-types: ["version-update:semver-major"]
      - dependency-name: "azure-storage-blob"
        update-types: ["version-update:semver-major"]
      - dependency-name: "backoff"
        update-types: ["version-update:semver-major"]
      - dependency-name: "boto3"
        update-types: ["version-update:semver-major"]
      - dependency-name: "cryptography"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expression"
        update-types: ["version-update:semver-major"]
      - dependency-name: "fastapi"
        update-types: ["version-update:semver-major"]
      - dependency-name: "fastapi-sso"
        update-types: ["version-update:semver-major"]
      - dependency-name: "granian"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gunicorn"
        update-types: ["version-update:semver-major"]
      - dependency-name: "inquirerpy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "litellm-proxy-extras"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
      - dependency-name: "orjson"
        update-types: ["version-update:semver-major"]
      - dependency-name: "polars"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pydantic-settings"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pyjwt"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pynacl"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python-multipart"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pyyaml"
        update-types: ["version-update:semver-major"]
      - dependency-name: "restrictedpython"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rich"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rq"
        update-types: ["version-update:semver-major"]
      - dependency-name: "soundfile"
        update-types: ["version-update:semver-major"]
      - dependency-name: "starlette"
        update-types: ["version-update:semver-major"]
      - dependency-name: "uvicorn"
        update-types: ["version-update:semver-major"]
      - dependency-name: "uvloop"
        update-types: ["version-update:semver-major"]
      - dependency-name: "websockets"
        update-types: ["version-update:semver-major"]

  # Desktop SPA (Vite/React)
  - package-ecosystem: "npm"
    directory: "/desktop"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      spa-deps:
        patterns:
          - "*"
    ignore:
      # Major bumps of the heavy UI libs (tldraw 4->5, lucide-react 0->1,
      # tsparticles 3->4, etc.) carry breaking API changes and must be migrated
      # deliberately (e.g. the tldraw engine migration, #75), not auto-merged.
      # Minor/patch bumps still flow through normally.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
