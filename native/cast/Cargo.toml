[package]
name = "taos-cast"
version = "0.1.0"
description = "Cast the taOS desktop to a TV (AirPlay) with a virtual output, and always restore the monitor"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "taos-cast"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
