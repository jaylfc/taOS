# swayfx only. Lets foreign windows (Chromium web apps, GTK apps) minimise with their own button: the client's
# xdg_toplevel.set_minimized (and a panel's foreign-toplevel minimise) parks the window in the scratchpad, and
# `taos-window mode-daemon` adds the taos marks so it restores to its workspace.
#
# INSTALL ORDER MATTERS. Do not install or include this file until the compositor built from native/compositor with
# patches/swayfx-0.6.1-minimize-registration.patch is the one running. Stock swayfx 0.6.1 crashes when this option is
# switched on or off by `swaymsg reload` while windows are mapped. With the patched build any reload is safe.
# Plain sway rejects the command (a config error bar); this file is not part of the shell sway snippets for that reason.
scratchpad_minimize yes
