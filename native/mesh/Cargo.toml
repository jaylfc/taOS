[package]
name = "taos-mesh"
version = "0.1.0"
description = "taOS mesh radio engine: Meshtastic and MeshCore drivers, zero-loss record store, radio identities, grants, local API and CLI"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "taos-mesh"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
serialport = { version = "4", default-features = false }

nix = { version = "0.26", default-features = false, features = ["term", "user", "socket", "fs"] }
zbus = { version = "5.13", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
nix = { version = "0.26", default-features = false, features = ["term", "fs"] }
