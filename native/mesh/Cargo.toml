[package]
name = "taos-mesh"
version = "0.1.0"
description = "taOS mesh radio engine: Meshtastic and MeshCore drivers, zero-loss record store, radio identities, grants, local API and CLI"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "taos-mesh"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
serialport = { version = "4", default-features = false }

