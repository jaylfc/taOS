# taOS window switcher and overview (taos-overview). Install as /etc/taos/sway.d/40-overview.conf.
#
# Alt+Tab: the switcher. The first press opens it with the previous window selected; while it is up
# the overlay owns the keyboard, and sway still runs these bindings, so every further Tab is a
# `switcher` command that moves the selection. Releasing Alt focuses the selection.
bindsym Mod1+Tab exec taos-overview switcher
bindsym Mod1+Shift+Tab exec taos-overview switcher --reverse

# Overview: a tap of the Super key (sway only runs a --release binding when no other key was
# pressed while Super was down, so Super+Return and friends do not open it), or Super+Tab.
bindsym --release Super_L exec taos-overview overview
bindsym Mod4+Tab exec taos-overview overview

# The shortcuts list, generated from the bindings sway has loaded (also reachable from the app menu's help entry).
bindsym Mod4+Control+Shift+h exec taos-overview help

# The overlay is a layer surface named "taos-overview"; let swayfx blur what is behind it.
layer_effects "taos-overview" blur enable; blur_ignore_transparent enable
