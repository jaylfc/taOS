# Display: native resolution and best refresh for every output, then the
# person's saved scale. Include this from the sway config, like the audio keys:
#   include /usr/share/taos/sway/45-taos-display.conf
# and put the `taos-display` binary on PATH (taos-bar's install does).
#
# exec_always runs on every sway reload too; it is safe to repeat (nothing is
# changed when the output is already as wanted). The bar subscribes to output
# events and handles plugging a monitor in; this line sets things up before
# the bar is there.
exec_always taos-display apply

# The person's own settings (~/.config/taos/sway.d/20-display.conf, written by
# the display menu) are picked up by the include of ~/.config/taos/sway.d/*.conf
# that /etc/taos/sway/config already has.
