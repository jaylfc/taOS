# The dock. Include this from the sway config, like the audio keys:
#   include /usr/share/taos/sway/47-taos-dock.conf
# The dock itself is started by taos-shell-session (component taos-dock); this file only holds what
# sway has to know about it. The dock is a layer-shell surface, so sway needs no window rules for it.
#
# Settings: `taos-dock set position left`, `taos-dock set autohide true`, `taos-dock set size large`
# (or edit ~/.config/taos/dock.json); a running dock follows the file at once.
#
# Layer effects (swayfx). The dock's surface is exactly the strip, so these touch nothing else. Plain sway
# rejects the command, so the line is commented out: enable it on swayfx.
#layer_effects "taos-dock" blur enable; blur_ignore_transparent enable; shadows enable; corner_radius 18
# Tooltips are their own tiny surfaces and need no effects.

# Super+D: show the dock and move the keyboard into it (arrow keys, Enter, Menu key, Escape to leave).
# NOTE: stock sway binds $mod+d to a launcher; this overrides it for the taOS session.
bindsym Mod4+d exec taos-dock focus
