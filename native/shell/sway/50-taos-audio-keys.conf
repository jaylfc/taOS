# Volume and microphone keys for the taOS session. Include this from the sway
# config:   include /usr/share/taos/sway/50-taos-audio-keys.conf
# Each key asks the running bar (taos-bar) to change the sound and to flash the
# level on screen. Steps are 5 points and stop at 100%: no over-amplification
# from the keyboard. --locked keeps them working on the lock screen.
bindsym --locked XF86AudioRaiseVolume exec taos-bar volume up
bindsym --locked XF86AudioLowerVolume exec taos-bar volume down
bindsym --locked XF86AudioMute        exec taos-bar volume mute
bindsym --locked XF86AudioMicMute     exec taos-bar volume mic-mute
