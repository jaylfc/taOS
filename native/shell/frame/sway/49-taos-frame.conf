# The window buttons for every window that does not draw its own header (web app windows, the terminal, Qt and
# GTK 3 windows without a header bar, Electron apps, apps from a container). Include this from the sway config, like the others:
#   include /usr/share/taos/sway/49-taos-frame.conf
# taos-frame (a shell component, started by taos-shell-session) paints the three window buttons over the corner of
# sway's own title bar and keeps that bar the theme's colours; this file gives those windows a title bar to paint over
# and makes it a blank-looking 32 px bar until then. Which windows are framed is the rule in frame/README.md: every window
# except taOS apps (own header), browsers, windows that told sway they draw their own header (border csd), GTK 4 /
# libadwaita apps (found from the process) and the self decorating list in ~/.config/taos/frame.json. taos-frame applies
# that rule at run time (a window is judged once sway has settled its decoration mode, a few tens of ms after it maps,
# at most 1 s); the for_window line below only avoids a first frame without the bar for web app windows.
#
# Layout: `border normal 1` makes sway reserve a title bar (it also handles drag to move and the tiling drop).
# The bar is tuned to 32 px by taos-frame at run time; the values below are its starting point.
font pango:Inter 13px
titlebar_padding 8 7
title_align center
for_window [app_id="^chrome-"] border normal 1

# Right click on a title bar (or a window border): the window menu (minimise, full size, close) of that window. sway focuses the window
# first, so "the focused window" is the one clicked. Does nothing for windows taos-frame does not frame.
bindsym --release --border button3 exec taos-frame menu
