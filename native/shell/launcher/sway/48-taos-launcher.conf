# taOS launcher (taos-launcher). Install as /etc/taos/sway.d/48-taos-launcher.conf.
#
# Keys bound here:  Mod4+space  (Super+Space)  ->  show or hide the launcher. Nothing else.
#
# NOTE FOR THE INSTALLER: the installed sway config binds $mod+space to `floating toggle`. With
# $mod = Mod4 that collides with the line below. Move that binding to Mod4+Shift+space:
#     bindsym $mod+Shift+space floating toggle
# (and drop the old `bindsym $mod+space floating toggle`) before this snippet is loaded.
bindsym Mod4+space exec taos-launcher toggle

# The launcher is a layer surface named "taos-launcher". swayfx blurs what is behind it:
layer_effects "taos-launcher" blur enable; blur_ignore_transparent enable
# Plain sway has no layer_effects; delete the line above and the panel falls back to its solid glass tint.
