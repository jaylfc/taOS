# Window controls: keys for the taos-window engine. Include this from the sway config, like the others:
#   include /usr/share/taos/sway/46-taos-window.conf
# and put `taos-window` on PATH.
#
# taOS apps draw their own header (close, minimise, full size) and keep a 1 px border; every other window gets sway's
# title bar with the same three buttons drawn on it by taos-frame (see frame/README.md). Minimised windows are parked in sway's scratchpad and carry
# taos_* marks; keep sway from drawing those marks in a title bar.
show_marks no

bindsym Mod4+m exec taos-window toggle-minimise focused
bindsym Mod4+Shift+m exec taos-window restore last
bindsym Mod4+Control+Up exec taos-window full focused
bindsym Mod4+Control+Shift+Up exec taos-window fullscreen focused
# Close is $mod+q in the base config (kill); it is not bound here.

# Desktop (floating windows plus the dock) or tiling, per workspace. The helper floats new windows on desktop
# workspaces; it is started with `exec` (not exec_always) so a reload does not start a second one.
bindsym Mod4+Shift+t exec taos-window mode toggle
exec taos-window mode-daemon

# taOS apps draw their own header: no sway title bar, the 1 px border stays.
for_window [app_id="^my\.taos\..*"] border pixel 1
# taOS apps open floating, so sway leaves them the size they ask for (a tiled window is first configured to the tile and
# a Qt app then opens at that size). taos-window mode-daemon tiles them again on a tiling workspace and cuts one that is
# larger than the free area (bar and dock excluded) down to it.
for_window [app_id="^my\.taos\..*"] floating enable

# GTK header bar apps draw their own window buttons: keep them on the side the theme (or the person) chose. foot asks
# for the compositor's title bar and gets the taOS buttons from taos-frame like every other window.
exec taos-window-session-hook watch

# Chromium and Chrome browser windows: let the browser draw its own frame (tabs, close button). Chromium always asks
# the compositor for server-side decorations and obeys the answer; `border csd` answers client-side and the browser
# redraws within a frame. Web app windows (chrome-<id>-<profile>, `--app`) draw no caption in Chromium either way,
# so they are left alone: see shell/window/README.md.
for_window [app_id="^(chromium|chromium-browser|google-chrome.*)$"] border csd

# Resizing and moving floating windows: Super with the left mouse button drags a window from anywhere inside it and
# Super with the right button resizes it from the nearest corner or edge (so a client's thin border is never the only
# handle). Keyboard: Super+Alt and the arrow keys resize the focused floating window in 40 px steps.
floating_modifier Mod4 normal
bindsym Mod4+Mod1+Left resize shrink width 40 px
bindsym Mod4+Mod1+Right resize grow width 40 px
bindsym Mod4+Mod1+Up resize shrink height 40 px
bindsym Mod4+Mod1+Down resize grow height 40 px
