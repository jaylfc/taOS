# Session environment for services that sway starts through D-Bus activation. Without it xdg-desktop-portal-gtk fails
# to start (it does not know it is on Wayland) and every portal-aware app, Chromium included, sits blank for about
# 25 seconds at launch. Measured on the real machine. `exec`, not `exec_always`: once per session, a reload does not run it.
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP=sway XDG_SESSION_TYPE=wayland
