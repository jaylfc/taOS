# taOS persistent virtual keyboard keymap fallback
# Ensures new Wayland clients always receive the active physical keyboard's keymap
# even after a per-command virtual keyboard is destroyed.

# When a virtual keyboard is destroyed, the seat's keymap may be reset.
# This drop-in ensures the keymap is re-applied for new clients.

# Force re-apply the seat's keymap on new connection
# This uses the seat's stored layout to ensure consistency
exec_when-idle sway-force-keep-keymap

# Fallback: if the virtual keyboard is gone, use the physical keyboard's keymap
# This ensures new clients always have a working keymap
bindsym $mod+Shift_L exec --no-startup-id swaymsg set_mode_name default