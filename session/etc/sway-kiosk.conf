# taOS kiosk session -- sway as a single-surface kiosk compositor.
#
# WHY SWAY AND NOT CAGE: cage 0.3.1 does not implement
# wlr-output-power-management-v1 (measured on the device), so nothing could ever
# turn this panel off -- only the backlight could be dimmed, which leaves the
# output powered and TOUCH LIVE. On an OLED handset that is both a burn-in risk
# and a phone that reacts to a pocket. sway implements output power management,
# per-device libinput configuration and a JSON IPC, so idle blanking, the power
# key and touch behave the way Plasma Mobile's do.
#
# The browser command itself is NOT here: taos-kiosk-launch resolves the
# chromium binary and the server URL at runtime and writes them to the include
# below. Keeping that seam means this file never hardcodes a path.

### Chrome-free single surface ###############################################
default_border none
default_floating_border none
hide_edge_borders --i3 both
focus_follows_mouse no
# No status bar: the kiosk surface owns the whole output.
bar {
    mode invisible
}
# Touch device: there is no mouse, so never paint a pointer.
seat * hide_cursor 1

### Idle -> real display power off ###########################################
# `output * power off` is wlr-output-power-management: the output is POWERED
# DOWN, not merely dimmed, and sway gates input while it is off -- a touch wakes
# the screen instead of pressing whatever is under the finger. This is the
# behaviour Plasma Mobile gives and the reason for the compositor swap.
# TAOS_KIOSK_IDLE_SECS is exported by taos-kiosk-launch.
# exec_always, not exec: `swaymsg reload` re-runs exec_always but NOT exec, so
# with plain exec a reload leaves the OLD swayidle running with the OLD timeout.
# The body lives in a script because sway's `;` is a config separator -- see it.
exec_always /usr/local/bin/taos-kiosk-idle

# Double-tap the dark screen to wake it. Started here rather than as a system
# unit so it inherits SWAYSOCK from the session -- it talks to the compositor,
# so it has to live inside it, the same reason the idle watcher does.
# exec_always, so a `swaymsg reload` replaces it instead of leaving two daemons
# racing to wake the same panel; the script drops any previous instance itself.
exec_always /usr/local/bin/taos-kiosk-dt2w-run

# Hold a claim on the light/proximity sensors so their readings stay LIVE.
# iio-sensor-proxy only polls a sensor while something has claimed it, and the
# volume keys' pocket gate reads proximity at press time -- a stale "not near"
# would let every pocket press through. See taos-sensord.
exec_always /usr/local/bin/taos-sensord

### Power key ################################################################
# logind is left at the image's stock HandlePowerKey=ignore ON PURPOSE: writing
# a logind config that this image deliberately ships without previously made a
# short press shut the phone down even inside KDE. The compositor owns the key
# instead, exactly as powerdevil owns it under Plasma.
# --locked so it still works while the display is off. The toggle is a script
# because sway refuses `power toggle` against the `*` wildcard -- see it.
# TAP = screen on/off, HOLD 1.5s = power menu (Jay's spec). The press arm starts
# a timer, the release arm races it; taos-kiosk-power-hold explains the marker
# that makes that race have exactly one winner. --no-repeat so holding the key
# does not fire `press` over and over as key autorepeat kicks in.
bindsym --locked --no-repeat XF86PowerOff exec /usr/local/bin/taos-kiosk-power-hold press
bindsym --locked --release XF86PowerOff exec /usr/local/bin/taos-kiosk-power-hold release
# Belt and braces: if this panel's power key does not resolve to the
# XF86PowerOff keysym, bind the raw evdev code instead. KEY_POWER is 116 and
# Wayland keycodes are evdev + 8, hence 124. Harmless when redundant.
bindcode --locked --no-repeat 124 exec /usr/local/bin/taos-kiosk-power-hold press
bindcode --locked --release 124 exec /usr/local/bin/taos-kiosk-power-hold release

### Volume keys ##############################################################
# Reported to the page, which owns the behaviour -- see taos-kiosk-volume for
# why the decision is not split across two places.
#
# --locked so they work while the display is off, and --no-repeat because key
# autorepeat while the rocker is held would otherwise look like a burst of
# separate presses; the HOLD is detected from press-to-release timing instead.
#
# Keysym AND keycode, the same belt-and-braces the power key uses: evdev
# KEY_VOLUMEUP is 115 and KEY_VOLUMEDOWN 114, and Wayland keycodes are evdev + 8
# (123 and 122). Measured from /proc/bus/input/devices: vol-up is gpio-keys,
# vol-down is pmic_resin, and the headset jack reports both -- which is exactly
# why these bind the keysym rather than a device.
bindsym --locked --no-repeat XF86AudioRaiseVolume exec /usr/local/bin/taos-kiosk-volume up press
bindsym --locked --release   XF86AudioRaiseVolume exec /usr/local/bin/taos-kiosk-volume up release
bindsym --locked --no-repeat XF86AudioLowerVolume exec /usr/local/bin/taos-kiosk-volume down press
bindsym --locked --release   XF86AudioLowerVolume exec /usr/local/bin/taos-kiosk-volume down release
bindcode --locked --no-repeat 123 exec /usr/local/bin/taos-kiosk-volume up press
bindcode --locked --release   123 exec /usr/local/bin/taos-kiosk-volume up release
bindcode --locked --no-repeat 122 exec /usr/local/bin/taos-kiosk-volume down press
bindcode --locked --release   122 exec /usr/local/bin/taos-kiosk-volume down release

### On-screen keyboard ######################################################
# DELIBERATELY NONE. taOS renders its own keyboards inside the page -- a numeric
# keypad on the lock screen and the shared on-screen keyboard on the password
# form -- so a compositor-level keyboard is a SECOND keyboard: squeekboard
# auto-showed a full QWERTY over the passcode pad and covered the lower third of
# the screen (measured on the device 2026-09-16). If a future surface needs a
# system keyboard, start it here and give the page inputmode="none" so the two
# cannot both open.

### Boot-to-kiosk visual continuity ##########################################
# WHY THIS EXISTS: without a background, sway paints black, and the user sees
# splash -> BLACK FOR ~16 SECONDS -> kiosk. Measured on the device 2026-09-16:
# plymouth quit at 18:03:20, chromium first painted at 18:03:36.
#
# This is the SAME wordmark the boot splash holds. taos.script ends by holding
# wordmark.png solid and stopping the glow, so a centred wordmark.png on true
# black is the splash's final frame exactly -- the handover has nothing to see.
# Do NOT use wordmark-glow.png here: that is the pulse overlay, and its opacity
# at rest is 0.
#
# swaybg is a SEPARATE package from sway and was NOT installed (apk info -e
# said so; sway logged "failed to execute 'swaybg'" every boot). The kiosk
# process PATH is /usr/local/bin:/usr/bin, so /usr/bin/swaybg is reachable.
output * bg /usr/share/taos/boot-wordmark.png center #000000

### The kiosk application ####################################################
include $XDG_RUNTIME_DIR/taos-kiosk-app.conf

### taOS apps ################################################################
# An app opened by taos-app-launch must COVER the kiosk, not tile beside it.
#
# Measured 2026-09-17: the kiosk surface holds `fullscreen_mode: 1` over the
# whole output, so the first app window launched beside it came up
# `visible: false` with a 0x0 rect -- running, painting nothing, invisible.
# Jay's report was "i cant see the camera", and this was why.
#
# The match is the hostname alias convention taos-app-launch establishes:
# every taOS app is served as <name>.taos, so chromium's derived app_id is
# chrome-<name>.taos__-Default. That also keeps this rule from catching the
# kiosk itself, which is chrome-127.0.0.1__-Default.
for_window [app_id="^chrome-[A-Za-z0-9.-]+\.taos__"] fullscreen enable
